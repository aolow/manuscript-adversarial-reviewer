[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manuscript-adversarial-review"
version = "0.4.0"
description = "Local, provenance-first adversarial manuscript review"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "All rights reserved"}
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
test = ["jsonschema>=4.18,<5"]
llm = ["jsonschema>=4.18,<5"]
bedrock = ["jsonschema>=4.18,<5", "boto3>=1.43,<2; python_version >= '3.10'"]

[project.scripts]
manuscript-review = "manuscript_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manuscript_review = ["reviewers/prompts/*.txt", "*.schema.json"]
